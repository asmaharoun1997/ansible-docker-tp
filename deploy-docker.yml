- name: Déploiement infrastructure Docker
  hosts: all
  become: yes
  vars_files:
    - vars.yml
    - vault.yml
  tasks:
    - name: Installer Docker
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur au groupe docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Installer module Python Docker
      apt:
        name: python3-docker
        state: present

    - name: Déployer MySQL (DB node)
      when: "'db' in group_names"
      community.docker.docker_container:
        name: "{{ mysql_container }}"
        image: "{{ mysql_image }}"
        state: started
        restart_policy: always
        env:
          MYSQL_DATABASE: "{{ mysql_database | string }}"
          MYSQL_USER: "{{ mysql_user | string }}"
          MYSQL_PASSWORD: "{{ mysql_password | string }}"
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password | string }}"
        ports:
          - "3306:3306"
        volumes:
          - /opt/mysql-init:/docker-entrypoint-initdb.d:ro

    - name: Créer le dossier d'initialisation MySQL
      when: "'db' in group_names"
      file:
        path: /opt/mysql-init
        state: directory
        mode: '0755'
    - name: Copier le script d'initialisation MySQL
      when: "'db' in group_names"
      copy:
        src: files/init.sql
        dest: /opt/mysql-init/init.sql
        mode: '0644'
    - name: Copier l'application Flask
      when: "'app' in group_names"
      copy:
        src: files/app.py
        dest: /opt/webapp/app.py
        mode: '0644'

    - name: Copier la configuration Nginx
      when: "'app' in group_names"
      copy:
        src: files/nginx.conf
        dest: /opt/webapp/nginx.conf
        mode: '0644'

    - name: Créer le réseau Docker applicatif
      when: "'app' in group_names"
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present

    - name: Déployer Python/Flask
      when: "'app' in group_names"
      community.docker.docker_container:
        name: "{{ python_container }}"
        image: "{{ python_image }}"
        state: started
        restart_policy: always
        networks:
          - name: "{{ docker_network }}"
        working_dir: /app
        command: bash -c "pip install --no-cache-dir flask mysql-connector-python && python app.py"
        env:
          DB_HOST: "{{ db_host | string }}"
          DB_NAME: "{{ mysql_database | string }}"
          DB_USER: "{{ mysql_user | string }}"
          DB_PASSWORD: "{{ mysql_password | string }}"
        volumes:
          - /opt/webapp:/app

    - name: Déployer application Web (APP node)
      when: "'app' in group_names"
      community.docker.docker_container:
        name: "{{ app_container }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        networks:
          - name: "{{ docker_network }}"
        ports:
          - "{{ app_port }}:80"
        volumes:
          - /opt/webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
