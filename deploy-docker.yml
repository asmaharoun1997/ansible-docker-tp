- name: Déploiement infrastructure Docker
  hosts: all
  become: yes
  vars_files:
    - vars.yml
    - vault.yml
  tasks:
    - name: Installer Docker
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur au groupe docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Installer module Python Docker
      apt:
        name: python3-docker
        state: present

    - name: Déployer MySQL (DB node)
      when: "'db' in group_names"
      community.docker.docker_container:
        name: "{{ mysql_container }}"
        image: "{{ mysql_image }}"
        state: started
        restart_policy: always
        env:
          MYSQL_DATABASE: "{{ mysql_database | string }}"
          MYSQL_USER: "{{ mysql_user | string }}"
          MYSQL_PASSWORD: "{{ mysql_password | string }}"
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password | string }}"
        ports:
          - "3306:3306"
        volumes:
          - /opt/mysql-init:/docker-entrypoint-initdb.d:ro

    - name: Créer le dossier d'initialisation MySQL
      when: "'db' in group_names"
      file:
        path: /opt/mysql-init
        state: directory
        mode: '0755'
    - name: Copier le script d'initialisation MySQL
      when: "'db' in group_names"
      copy:
        src: files/init.sql
        dest: /opt/mysql-init/init.sql
        mode: '0644'
    - name: Copier la page d'accueil
      when: "'app' in group_names"
      copy:
        src: files/index.html
        dest: /opt/webapp/index.html
        mode: '0644'



    - name: Déployer application Web (APP node)
      when: "'app' in group_names"
      community.docker.docker_container:
        name: "{{ app_container }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ app_port }}:80"
        volumes:
          - /opt/webapp:/usr/share/nginx/html:ro


